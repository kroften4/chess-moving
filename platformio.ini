[env:black_f407vg]
platform = ststm32
board = black_f407vg
framework = arduino
board_build.flash_offset = 0x8000
board_upload.offset_address = 0x8008000
lib_deps =
    teemuatlut/TMCStepper @ 0.7.3
    waspinator/AccelStepper @ 1.64
